version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: url-shortener-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: url-shortener-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: url-shortener-api
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: urlshortener
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-secret-key

volumes:
  postgres-data: