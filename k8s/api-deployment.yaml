apiVersion: apps/v1
kind: Deployment

metadata:
  name: url-shortener-api
  namespace: url-shortener

spec:
  replicas: 2

  selector:
    matchLabels:
      app: url-shortener-api

  template:
    metadata:
      labels:
        app: url-shortener-api

    spec:
      containers:
        - name: url-shortener-api

          image: url-shortener:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          env:

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: PORT

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: DB_NAME

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: url-shortener-config
                  key: REDIS_PORT

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: url-shortener-secret
                  key: JWT_SECRET